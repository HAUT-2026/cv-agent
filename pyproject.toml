[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cvagent"
version = "0.1.0"
description = "Role 1 workflow and state contracts for the CVAgent MVP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "langgraph-cli[inmem]>=0.4.42",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
# Rol 4 · portal, API y lectura de PDF. El núcleo (Rol 1 y Rol 2) no las necesita.
portal = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pdfplumber>=0.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27",
]

[project.scripts]
cvagent-demo = "cvagent.cli.demo:main"
cvagent-postgres-setup = "cvagent.cli.postgres_setup:main"
cvagent-portal = "portal.__main__:main"

[tool.setuptools.packages.find]
include = ["cvagent*", "reglas*", "portal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a running local PostgreSQL configured by CVAGENT_POSTGRES_URL",
]
