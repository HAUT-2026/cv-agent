[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cvagent"
version = "0.1.0"
description = "Role 1 workflow and state contracts for the CVAgent MVP"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=3.0,<4.0",
    "pydantic>=2.10,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["cvagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
